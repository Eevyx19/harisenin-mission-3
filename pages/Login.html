<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chill</title>

    <link rel="stylesheet" href="../style/login.css">
</head>

<body>
    <main>
        <div class="logo">
            <img src="../images/Logo.png" alt="chill app logo">
            <p>CHILL</p>
        </div>
        <div class="header">
            <h1>Masuk</h1>
            <p>Selamat datang kembali!</p>
        </div>

        <form action="" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="username" id="username" name="username" placeholder="Masukan sername" required>
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <div class="form-password">
                    <input type="password" id="password" name="password" placeholder="Masukan kata sandi" required>
                    <img src="../images//eye-off.png" alt="show password">
                </div>
                <div class="other-action">
                    <p>Belum punya akun? <a href="Register.html">Daftar</a></p>
                    <a href="#">Lupa kata sandi?</a>
                </div>
            </div>
            <div class="form-action">
                <button class="submit" type="submit">Masuk</button>
                <p>Atau</p>
                <button type="button">
                    <img src="../images/google-logo.png" alt="Google Icon">
                    <span>Masuk dengan Google</span>
                </button>
            </div>
        </form>

    </main>
</body>

</html>
